<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Registration Form</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-body">

                    <h1 class="text-center mb-4">
                        Register
                    </h1>

                    <form id="registrationForm" novalidate>

                        <!-- Username -->

                        <div class="mb-3">

                            <label
                                for="username"
                                class="form-label"
                            >
                                Username
                            </label>

                            <input
                                type="text"
                                id="username"
                                class="form-control"
                                required
                                minlength="3"
                            >

                            <div
                                class="text-danger small mt-1"
                                id="usernameError"
                            ></div>

                        </div>

                        <!-- Email -->

                        <div class="mb-3">

                            <label
                                for="email"
                                class="form-label"
                            >
                                Email
                            </label>

                            <input
                                type="email"
                                id="email"
                                class="form-control"
                                required
                            >

                            <div
                                class="text-danger small mt-1"
                                id="emailError"
                            ></div>

                        </div>

                        <!-- Password -->

                        <div class="mb-3">

                            <label
                                for="password"
                                class="form-label"
                            >
                                Password
                            </label>

                            <input
                                type="password"
                                id="password"
                                class="form-control"
                                required
                                minlength="8"
                                pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}"
                            >

                            <div class="form-text">
                                Password must be at least 8 characters and contain an uppercase letter, lowercase letter, and a number.
                            </div>

                            <div
                                class="text-danger small mt-1"
                                id="passwordError"
                            ></div>

                        </div>

                        <!-- Confirm Password -->

                        <div class="mb-4">

                            <label
                                for="confirmPassword"
                                class="form-label"
                            >
                                Confirm Password
                            </label>

                            <input
                                type="password"
                                id="confirmPassword"
                                class="form-control"
                                required
                            >

                            <div
                                class="text-danger small mt-1"
                                id="confirmPasswordError"
                            ></div>

                        </div>

                        <div class="d-grid">

                            <button
                                class="btn btn-primary"
                                type="submit"
                            >
                                Register
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
